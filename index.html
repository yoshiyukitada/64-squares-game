

<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<title>64 SQUARES</title>

<style>

html, body {

  margin: 0;

  padding: 0;

  width: 100%;

  height: 100%;

  overflow: hidden;

  background: #fff;

  touch-action: none;

}

canvas {

  display: block;

  touch-action: none;

}

</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>

</head>

<body>

<script>

const N = 8;

let cell;

let squareSize;

let particles = [];

let pointerDown = false;

let pointerX = 0;

let pointerY = 0;

let lastTapTime = 0;

let resetting = false;

function setup() {

  createCanvas(windowWidth, windowHeight);

  pixelDensity(1);

  noStroke();

  rectMode(CENTER);

  calculateLayout();

}

function calculateLayout() {

  // 画面内に収まる8×8グリッドの大きさ

  const safeWidth = width * 0.88;

  const safeHeight = height * 0.72;

  const gridSize = min(safeWidth, safeHeight);

  // 8個の四角と7個分の間隔を含む配置

  cell = gridSize / 8.5;

  squareSize = cell * 0.72;

  initializeParticles();

}

function initializeParticles() {

  particles = [];

  for (let r = 0; r < N; r++) {

    for (let c = 0; c < N; c++) {

      const x = width / 2 + (c - 3.5) * cell;

      const y = height / 2 + (r - 3.5) * cell;

      particles.push(new SquareParticle(x, y));

    }

  }

  resetting = false;

}

function draw() {

  background(255);

  fill(0);

  for (const p of particles) {

    p.update();

    rect(p.x, p.y, squareSize, squareSize);

  }

  // 全ての四角が元の位置に戻ったら整列モードを終了

  if (resetting && particles.every(p => p.isHome())) {

    resetting = false;

  }

}

function handlePress(x, y) {

  pointerX = x;

  pointerY = y;

  pointerDown = true;

  const now = millis();

  if (now - lastTapTime < 350) {

    resetting = true;

    pointerDown = false;

    lastTapTime = 0;

  } else {

    lastTapTime = now;

  }

}

function mousePressed() {

  handlePress(mouseX, mouseY);

  return false;

}

function mouseDragged() {

  pointerX = mouseX;

  pointerY = mouseY;

  return false;

}

function mouseReleased() {

  pointerDown = false;

  return false;

}

function touchStarted() {

  handlePress(mouseX, mouseY);

  return false;

}

function touchMoved() {

  pointerX = mouseX;

  pointerY = mouseY;

  return false;

}

function touchEnded() {

  pointerDown = false;

  return false;

}

function windowResized() {

  resizeCanvas(windowWidth, windowHeight);

  calculateLayout();

  pointerDown = false;

}

class SquareParticle {

  constructor(x, y) {

    this.homeX = x;

    this.homeY = y;

    this.x = x;

    this.y = y;

    this.vx = 0;

    this.vy = 0;

  }

  isHome() {

    return abs(this.x - this.homeX) < 0.5 &&

           abs(this.y - this.homeY) < 0.5 &&

           abs(this.vx) < 0.5 &&

           abs(this.vy) < 0.5;

  }

  update() {

    if (resetting) {

      this.vx += (this.homeX - this.x) * 0.12;

      this.vy += (this.homeY - this.y) * 0.12;

      this.vx *= 0.72;

      this.vy *= 0.72;

      this.x += this.vx;

      this.y += this.vy;

      if (this.isHome()) {

        this.x = this.homeX;

        this.y = this.homeY;

        this.vx = 0;

        this.vy = 0;

      }

      return;

    }

    if (pointerDown) {

      const dx = this.x - pointerX;

      const dy = this.y - pointerY;

      const d = sqrt(dx * dx + dy * dy);

      const influence = cell * 2.5;

      if (d < influence && d > 0.1) {

        const force = (influence - d) / influence;

        this.vx += (dx / d) * force * 1.8;

        this.vy += (dy / d) * force * 1.8;

      }

    }

    this.vx *= 0.97;

    this.vy *= 0.97;

    this.x += this.vx;

    this.y += this.vy;

    const margin = squareSize / 2;

    if (this.x < margin || this.x > width - margin) {

      this.x = constrain(this.x, margin, width - margin);

      this.vx *= -0.7;

    }

    if (this.y < margin || this.y > height - margin) {

      this.y = constrain(this.y, margin, height - margin);

      this.vy *= -0.7;

    }

  }

}

</script>

</body>

</html>
