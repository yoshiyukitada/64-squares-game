<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>64 Squares</title>
<style>
html,body{margin:0;padding:0;overflow:hidden;background:#fff;touch-action:none}
canvas{display:block}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
</head>
<body>
<script>
const N=8;
let cell,particles=[];
let pointerDown=false,pointerX=0,pointerY=0,lastTapTime=0;

function setup(){
 createCanvas(windowWidth,windowHeight);
 pixelDensity(1);
 noStroke();
 rectMode(CENTER);
 initializeParticles();
}
function initializeParticles(){
 cell=min(width,height)/10;
 particles=[];
 for(let r=0;r<N;r++){
  for(let c=0;c<N;c++){
   let x=width/2+(c-3.5)*cell;
   let y=height/2+(r-3.5)*cell;
   particles.push(new SquareParticle(x,y));
  }
 }
}
function draw(){
 background(255);
 for(let p of particles){
  p.update();
  fill(0);
  rect(p.x,p.y,cell*0.72,cell*0.72);
 }
}
function handlePress(x,y){
 pointerX=x;pointerY=y;pointerDown=true;
 let now=millis();
 if(now-lastTapTime<350){
  resetParticles();
  lastTapTime=0;
 }else lastTapTime=now;
}
function resetParticles(){
 pointerDown=false;
 for(let p of particles){
  p.x=p.homeX;p.y=p.homeY;p.vx=0;p.vy=0;p.phase=random(TWO_PI);
 }
}
function mousePressed(){handlePress(mouseX,mouseY);return false;}
function mouseDragged(){pointerX=mouseX;pointerY=mouseY;return false;}
function mouseReleased(){pointerDown=false;return false;}
function touchStarted(){handlePress(mouseX,mouseY);return false;}
function touchMoved(){pointerX=mouseX;pointerY=mouseY;return false;}
function touchEnded(){pointerDown=false;return false;}
function windowResized(){resizeCanvas(windowWidth,windowHeight);initializeParticles();}
class SquareParticle{
 constructor(x,y){
  this.homeX=x;this.homeY=y;this.x=x;this.y=y;
  this.vx=0;this.vy=0;this.phase=random(TWO_PI);
 }
 update(){
  let t=millis()*0.001;
  let targetX=this.homeX+sin(t*0.8+this.phase)*cell*0.12;
  let targetY=this.homeY+cos(t*0.7+this.phase*1.3)*cell*0.12;
  this.vx+=(targetX-this.x)*0.035;
  this.vy+=(targetY-this.y)*0.035;
  if(pointerDown){
   let dx=this.x-pointerX,dy=this.y-pointerY;
   let d=sqrt(dx*dx+dy*dy),influence=cell*2.8;
   if(d<influence&&d>0.1){
    let force=(1-d/influence)*1.8;
    this.vx+=(dx/d)*force;
    this.vy+=(dy/d)*force;
   }
  }
  this.vx*=0.90;this.vy*=0.90;
  this.x+=this.vx;this.y+=this.vy;
  let margin=cell*0.36;
  if(this.x<margin||this.x>width-margin){
   this.x=constrain(this.x,margin,width-margin);this.vx*=-0.5;
  }
  if(this.y<margin||this.y>height-margin){
   this.y=constrain(this.y,margin,height-margin);this.vy*=-0.5;
  }
 }
}
</script>
</body>
</html>
